<mat-sidenav-container>
    <mat-sidenav #sidenav position="end" mode="over" [(opened)]="menuOpen">
        <mat-nav-list>
            <a mat-list-item routerLink="/races" (click)="closeMenu()">
                <mat-icon matListItemIcon>directions_run</mat-icon>
                Versenyek
            </a>
            @if (isAuthenticated$ | async) {
            <a mat-list-item routerLink="/relay-planner/teams" (click)="closeMenu()">
                <mat-icon matListItemIcon>group</mat-icon>
                Csapatok
            </a>
            }
            @if (isAdmin()) {
            <a mat-list-item routerLink="/admin/races" (click)="closeMenu()">
                <mat-icon matListItemIcon>admin_panel_settings</mat-icon>
                Verseny adminisztráció
            </a>
            }
            <a mat-list-item routerLink="/pace-calculator" (click)="closeMenu()">
                <mat-icon matListItemIcon>calculate</mat-icon>
                Tempó kalkulátor
            </a>
            <mat-divider></mat-divider>
            @if (isAuthenticated$ | async) {
            <a mat-list-item (click)="onLogout(); closeMenu()">
                <mat-icon matListItemIcon>logout</mat-icon>
                Kijelentkezés
            </a>
            } @else {
            <a mat-list-item routerLink="/login" (click)="closeMenu()">
                <mat-icon matListItemIcon>login</mat-icon>
                Belépés
            </a>
            }
        </mat-nav-list>
    </mat-sidenav>

    <mat-sidenav-content>
        <app-public-header (menuToggled)="toggleMenu()"></app-public-header>
        <router-outlet></router-outlet>
    </mat-sidenav-content>
</mat-sidenav-container>
