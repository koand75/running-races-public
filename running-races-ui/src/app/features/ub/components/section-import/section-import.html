<div class="container">
    <div class="page-header">
        <h1>Szakasz import</h1>
    </div>

    <div class="header-actions">
        <input type="file" #fileInput accept=".csv" (change)="onFileSelected($event)" hidden>
        <button mat-raised-button color="primary" (click)="fileInput.click()">
            <mat-icon>upload</mat-icon> CSV Import
        </button>
        <button mat-raised-button color="primary" [disabled]="!canImport()" (click)="executeImport()">
            <mat-icon>save</mat-icon> Importálás
        </button>
        <a mat-stroked-button href="/samples/sampleSections.csv" download>
            <mat-icon>download</mat-icon> Mintafájl letöltése
        </a>

    </div>
    @if (previewResult) {
    <table mat-table [dataSource]="previewResult">
        <ng-container matColumnDef="order">
            <th mat-header-cell *matHeaderCellDef>#</th>
            <td mat-cell *matCellDef="let section">{{ section.order }}</td>
        </ng-container>

        <ng-container matColumnDef="name">
            <th mat-header-cell *matHeaderCellDef>Név</th>
            <td mat-cell *matCellDef="let section">
                <button mat-icon-button (click)="openDetail(section, 'start')">
                    <mat-icon
                        [class]="section.startWayPointStatus === 0 ? 'status-exact' : section.startWayPointStatus === 1 ? 'status-partial' : 'status-not-found'">{{
                        section.startWayPointStatus === 0 ? 'check_circle' : section.startWayPointStatus === 1 ?
                        'warning' : 'error' }}</mat-icon>
                </button>
                {{ section.startWayPointName }}
                -
                <button mat-icon-button (click)="openDetail(section, 'end')">
                    <mat-icon
                        [class]="section.endWayPointStatus === 0 ? 'status-exact' : section.endWayPointStatus === 1 ? 'status-partial' : 'status-not-found'">{{
                        section.endWayPointStatus === 0 ? 'check_circle' : section.endWayPointStatus === 1 ? 'warning' :
                        'error' }}</mat-icon>
                </button>
                {{ section.endWayPointName }}
            </td>
        </ng-container>

        <ng-container matColumnDef="distance">
            <th mat-header-cell *matHeaderCellDef>Táv (km)</th>
            <td mat-cell *matCellDef="let section">{{ section.distance }}</td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
    }
</div>
